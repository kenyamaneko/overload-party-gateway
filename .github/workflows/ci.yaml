# post-merge image build & push は deploy.yaml に分離
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      code-changed:
        description: "'true' when the run touched code. The test results exist only then."
        value: ${{ jobs.ci.outputs.code-changed }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main の run は GitHub Pages への deploy に繋がるため、後続の push で打ち切らない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-ci.yaml@main
    with:
      test-packages: ./internal/...
      # go:build integration を持つのはこの2パッケージのみ。絞らないと -tags=integration が
      # 残りの全パッケージも再コンパイル・再実行し、単体テストと同じ結果を二重に生む。
      integration-test-packages: ./internal/repository/... ./internal/adapter/redistimer/...
      extra-test-module-dir: packages/internalauth-go
      collect-unit-coverage: true
      needs-firestore-emulator: true
    secrets: inherit
