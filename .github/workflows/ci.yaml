name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  PROJECT_ID: keyandnotes-platform
  REPOSITORY: overload-party
  IMAGE_NAME: gateway

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.COMMON_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-common".insteadOf "https://github.com/kenyamaneko/overload-party-common"
          git config --global url."https://x-access-token:${{ secrets.BATTLE_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-battle".insteadOf "https://github.com/kenyamaneko/overload-party-battle"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-card".insteadOf "https://github.com/kenyamaneko/overload-party-card"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-account".insteadOf "https://github.com/kenyamaneko/overload-party-account"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-shop".insteadOf "https://github.com/kenyamaneko/overload-party-shop"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-scenario".insteadOf "https://github.com/kenyamaneko/overload-party-scenario"
        env:
          GOPRIVATE: github.com/kenyamaneko/*
          GONOSUMDB: github.com/kenyamaneko/*
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - run: golangci-lint run --timeout 5m ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.COMMON_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-common".insteadOf "https://github.com/kenyamaneko/overload-party-common"
          git config --global url."https://x-access-token:${{ secrets.BATTLE_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-battle".insteadOf "https://github.com/kenyamaneko/overload-party-battle"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-card".insteadOf "https://github.com/kenyamaneko/overload-party-card"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-account".insteadOf "https://github.com/kenyamaneko/overload-party-account"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-shop".insteadOf "https://github.com/kenyamaneko/overload-party-shop"
          git config --global url."https://x-access-token:${{ secrets.SERVICES_GO_MODULES_FETCH }}@github.com/kenyamaneko/overload-party-scenario".insteadOf "https://github.com/kenyamaneko/overload-party-scenario"
        env:
          GOPRIVATE: github.com/kenyamaneko/*
          GONOSUMDB: github.com/kenyamaneko/*
      - name: Run unit tests
        run: go test -race ./internal/... -count=1
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  build-and-push:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
          COMMON_GO_MODULES_FETCH: ${{ secrets.COMMON_GO_MODULES_FETCH }}
          BATTLE_GO_MODULES_FETCH: ${{ secrets.BATTLE_GO_MODULES_FETCH }}
          SERVICES_GO_MODULES_FETCH: ${{ secrets.SERVICES_GO_MODULES_FETCH }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build \
            --secret id=COMMON_GO_MODULES_FETCH,env=COMMON_GO_MODULES_FETCH \
            --secret id=BATTLE_GO_MODULES_FETCH,env=BATTLE_GO_MODULES_FETCH \
            --secret id=SERVICES_GO_MODULES_FETCH,env=SERVICES_GO_MODULES_FETCH \
            -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
