name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  PROJECT_ID: keyandnotes-platform
  REPOSITORY: overload-party
  IMAGE_NAME: gateway

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run --timeout 5m ./...
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run unit tests
        run: go test -race ./internal/... -count=1
        env:
          GOPRIVATE: github.com/kenyamaneko/*

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up gcloud (Firestore emulator)
        uses: google-github-actions/setup-gcloud@v2
      - name: Install Firestore emulator component
        run: gcloud components install cloud-firestore-emulator beta --quiet
      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:9041 >/tmp/firestore.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:9041 >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator failed to start"; cat /tmp/firestore.log; exit 1
      - name: Configure Go private modules
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Run integration tests
        run: go test -race -tags=integration ./internal/... -count=1
        env:
          GOPRIVATE: github.com/kenyamaneko/*
          FIRESTORE_EMULATOR_HOST: localhost:9041
          FIRESTORE_PROJECT_ID: overload-party-test

  codegen-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure private repo auth
        uses: kenyamaneko/overload-party-common/.github/actions/setup-go-private-modules@main
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
      - name: Install Python dependencies
        run: |
          pip install \
            "overload-party-codegen-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/codegen-tools" \
            "overload-party-asyncapi-codegen-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/asyncapi-codegen-tools"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Run codegen (OpenAPI + AsyncAPI)
        run: scripts/generate_types.sh
      - name: Check for drift
        run: .github/scripts/ci/check-codegen-drift.sh

  build-and-push:
    needs: [lint, test-unit, test-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Generate Cross-Repo Deps App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
          GO_MODULES_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build \
            --secret id=GO_MODULES_TOKEN,env=GO_MODULES_TOKEN \
            -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
