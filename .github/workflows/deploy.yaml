name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: Git tag to promote to prod (e.g. v1.2.3).
        required: true
        type: string

permissions:
  contents: read
  # Workload Identity Federation で Google Cloud に認証するために OIDC トークンの発行権限が必要
  id-token: write

jobs:
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-dev-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: gateway
      target: dev
      project-id: ${{ vars.DEV_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}

  deploy-stg:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: deploy-stg-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: gateway
      target: stg
      project-id: ${{ vars.STG_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}
      version: ${{ github.ref_name }}

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-prod-${{ github.repository }}
      # デプロイ中断による中途半端な反映を避けるため、実行中の処理を中止しない
      cancel-in-progress: false
    uses: kenyamaneko/overload-party-common/.github/workflows/go-service-deploy.yaml@main
    secrets: inherit
    with:
      image-name: gateway
      target: prod
      project-id: ${{ vars.PROD_PROJECT_ID }}
      region: ${{ vars.RUN_REGION }}
      version: ${{ inputs.version }}
