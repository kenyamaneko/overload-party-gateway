asyncapi: 3.0.0
info:
  title: overload-party-gateway WebSocket
  version: 0.1.0
  description: |
    Gateway service が client と交換する WebSocket メッセージの契約。
    本ファイルが SSoT。`packages/api-gateway` の WS メッセージ型と type 定数は
    asyncapi-codegen が本ファイルから生成する。
    各メッセージは type フィールド (string const) と data ペイロードを持つ
    エンベロープに格納されて送受信される。

channels:
  # ─── Client → Server (gateway が receive 側) ──────────────────────
  GameEnter:
    address: game_enter
    description: "既存ゲームへ参加する要求 (例: PvP マッチ成立後の入室)。"
    messages:
      GameEnterMessage:
        $ref: "#/components/messages/GameEnterMessage"

  MatchmakingStart:
    address: matchmaking_start
    description: マッチング待ち行列に登録する。
    messages:
      MatchmakingStartMessage:
        $ref: "#/components/messages/MatchmakingStartMessage"

  GameAction:
    address: game_action
    description: プレイヤーが実行したアクションを送信する。
    messages:
      GameActionMessage:
        $ref: "#/components/messages/GameActionMessage"

  UseStamp:
    address: use_stamp
    description: 対戦中のスタンプ送信。
    messages:
      UseStampMessage:
        $ref: "#/components/messages/UseStampMessage"

  NpcBattleStart:
    address: npc_battle_start
    description: NPC バトルを開始する。
    messages:
      NpcBattleStartMessage:
        $ref: "#/components/messages/NpcBattleStartMessage"

  # ─── Server → Client (gateway が send 側) ─────────────────────────
  Error:
    address: error
    description: WS 接続上で発生したサーバー側エラー通知。
    messages:
      ErrorMessage:
        $ref: "#/components/messages/ErrorMessage"

  MatchFound:
    address: match_found
    description: マッチング成立を通知。
    messages:
      MatchFoundMessage:
        $ref: "#/components/messages/MatchFoundMessage"

  GameOver:
    address: game_over
    description: ゲーム終了を通知 (勝敗確定)。
    messages:
      GameOverMessage:
        $ref: "#/components/messages/GameOverMessage"

  ActionRejected:
    address: action_rejected
    description: アクションが拒否された通知。
    messages:
      ActionRejectedMessage:
        $ref: "#/components/messages/ActionRejectedMessage"

  ActionPerformed:
    address: action_performed
    description: アクション実行とその結果のゲーム状態を通知。
    messages:
      ActionPerformedMessage:
        $ref: "#/components/messages/ActionPerformedMessage"

  StampUsed:
    address: stamp_used
    description: 対戦中のスタンプ送信を相手に通知。
    messages:
      StampUsedMessage:
        $ref: "#/components/messages/StampUsedMessage"

  NpcBattleCreated:
    address: npc_battle_created
    description: NPC バトルが作成され開始可能になったことを通知。
    messages:
      NpcBattleCreatedMessage:
        $ref: "#/components/messages/NpcBattleCreatedMessage"

  OpponentDisconnected:
    address: opponent_disconnected
    description: 対戦相手が切断したことを通知。
    messages:
      OpponentDisconnectedMessage:
        $ref: "#/components/messages/OpponentDisconnectedMessage"

  OpponentReconnected:
    address: opponent_reconnected
    description: 切断していた対戦相手が再接続したことを通知。
    messages:
      OpponentReconnectedMessage:
        $ref: "#/components/messages/OpponentReconnectedMessage"

  ServerUpdate:
    address: server_update
    description: サーバー更新のため接続を終了することを接続中のクライアントへ通知。送信後に WS 接続を閉じる。
    messages:
      ServerUpdateMessage:
        $ref: "#/components/messages/ServerUpdateMessage"

operations:
  # ─── Client → Server (gateway が receive する) ─────────────────────
  receiveGameEnter:
    action: receive
    channel:
      $ref: "#/channels/GameEnter"
    summary: 既存ゲームへ参加する旨をクライアントから受信。

  receiveMatchmakingStart:
    action: receive
    channel:
      $ref: "#/channels/MatchmakingStart"
    summary: マッチング開始要求をクライアントから受信。

  receiveGameAction:
    action: receive
    channel:
      $ref: "#/channels/GameAction"
    summary: プレイヤーアクションをクライアントから受信。

  receiveUseStamp:
    action: receive
    channel:
      $ref: "#/channels/UseStamp"
    summary: 対戦スタンプ送信要求をクライアントから受信。

  receiveNpcBattleStart:
    action: receive
    channel:
      $ref: "#/channels/NpcBattleStart"
    summary: NPC バトル開始要求をクライアントから受信。

  # ─── Server → Client (gateway が send する) ───────────────────────
  sendError:
    action: send
    channel:
      $ref: "#/channels/Error"
    summary: WS エラーをクライアントへ通知。

  sendMatchFound:
    action: send
    channel:
      $ref: "#/channels/MatchFound"
    summary: マッチング成立をクライアントへ通知。

  sendGameOver:
    action: send
    channel:
      $ref: "#/channels/GameOver"
    summary: ゲーム終了をクライアントへ通知。

  sendActionRejected:
    action: send
    channel:
      $ref: "#/channels/ActionRejected"
    summary: アクション拒否をクライアントへ通知。

  sendActionPerformed:
    action: send
    channel:
      $ref: "#/channels/ActionPerformed"
    summary: アクション実行結果をクライアントへ通知。

  sendStampUsed:
    action: send
    channel:
      $ref: "#/channels/StampUsed"
    summary: 対戦相手のスタンプ送信を通知。

  sendNpcBattleCreated:
    action: send
    channel:
      $ref: "#/channels/NpcBattleCreated"
    summary: NPC バトル作成完了を通知。

  sendOpponentDisconnected:
    action: send
    channel:
      $ref: "#/channels/OpponentDisconnected"
    summary: 対戦相手の切断を通知。

  sendOpponentReconnected:
    action: send
    channel:
      $ref: "#/channels/OpponentReconnected"
    summary: 対戦相手の再接続を通知。

  sendServerUpdate:
    action: send
    channel:
      $ref: "#/channels/ServerUpdate"
    summary: サーバー更新による接続の終了をクライアントへ通知。

components:
  messages:
    # ─── Client → Server messages ───────────────────────────────────
    GameEnterMessage:
      name: GameEnterMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameEnterMessage"

    MatchmakingStartMessage:
      name: MatchmakingStartMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MatchmakingStartMessage"

    GameActionMessage:
      name: GameActionMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameActionMessage"

    UseStampMessage:
      name: UseStampMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/UseStampMessage"

    NpcBattleStartMessage:
      name: NpcBattleStartMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NpcBattleStartMessage"

    # ─── Server → Client messages ───────────────────────────────────
    ErrorMessage:
      name: ErrorMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ErrorMessage"

    MatchFoundMessage:
      name: MatchFoundMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MatchFoundMessage"

    GameOverMessage:
      name: GameOverMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/GameOverMessage"

    ActionRejectedMessage:
      name: ActionRejectedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ActionRejectedMessage"

    ActionPerformedMessage:
      name: ActionPerformedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ActionPerformedMessage"

    StampUsedMessage:
      name: StampUsedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StampUsedMessage"

    NpcBattleCreatedMessage:
      name: NpcBattleCreatedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NpcBattleCreatedMessage"

    OpponentDisconnectedMessage:
      name: OpponentDisconnectedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/OpponentDisconnectedMessage"

    OpponentReconnectedMessage:
      name: OpponentReconnectedMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/OpponentReconnectedMessage"

    ServerUpdateMessage:
      name: ServerUpdateMessage
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ServerUpdateMessage"

  schemas:
    # ─── Client → Server payloads ───────────────────────────────────
    GameEnterMessage:
      type: object
      description: 既存ゲームへ参加する要求 (PvP マッチ成立後の入室など)。
      required: [game_id, deck_id]
      properties:
        game_id:
          type: string
        deck_id:
          type: integer
          format: int64

    MatchmakingStartMessage:
      type: object
      description: マッチング待ち行列への登録要求。
      required: [deck_id]
      properties:
        deck_id:
          type: integer
          format: int64

    GameActionMessage:
      type: object
      description: プレイヤーが実行したアクションをサーバーへ送信する。
      required: [game_id, action_type, data]
      properties:
        game_id:
          type: string
        action_type:
          type: string
        data:
          type: object
          additionalProperties: true
          description: アクション固有データ (downstream battle に渡す raw JSON)

    UseStampMessage:
      type: object
      description: 対戦中のスタンプ送信。
      required: [game_id, stamp_no]
      properties:
        game_id:
          type: string
        stamp_no:
          type: integer
          format: int64

    NpcBattleStartMessage:
      type: object
      description: NPC バトル開始要求。
      required: [deck_id, npc_model]
      properties:
        deck_id:
          type: integer
          format: int64
        npc_model:
          type: string

    # ─── Server → Client payloads ───────────────────────────────────
    ErrorMessage:
      type: object
      description: サーバー由来のエラー通知。
      required: [error_code, message, retryable]
      properties:
        error_code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    MatchFoundMessage:
      type: object
      description: マッチング成立通知。
      required: [game_id]
      properties:
        game_id:
          type: string

    GameOverMessage:
      type: object
      description: ゲーム終了通知。
      required: [game_id, winning_player_num, win_reason]
      properties:
        game_id:
          type: string
        winning_player_num:
          type: integer
          format: int64
        win_reason:
          type: string

    ActionRejectedMessage:
      type: object
      description: アクション拒否通知。
      required: [game_id, action_type, reason]
      properties:
        game_id:
          type: string
        action_type:
          type: string
        reason:
          type: string

    ActionPerformedMessage:
      type: object
      description: アクション実行とその後の (情報秘匿適用済み) ゲーム状態通知。
      required: [sequence, action_type, action_data, state]
      properties:
        sequence:
          type: integer
          format: int64
        action_type:
          type: string
        action_data:
          type: object
          additionalProperties: true
        state:
          type: object
          additionalProperties: true
          description: アクション実行後のゲーム状態 (battle 由来 raw JSON)

    StampUsedMessage:
      type: object
      description: 対戦相手 (または自分) のスタンプ送信通知。
      required: [game_id, player_num, stamp_no]
      properties:
        game_id:
          type: string
        player_num:
          type: integer
          format: int64
        stamp_no:
          type: integer
          format: int64

    NpcBattleCreatedMessage:
      type: object
      description: NPC バトル作成完了通知。
      required: [game_id]
      properties:
        game_id:
          type: string

    OpponentDisconnectedMessage:
      type: object
      description: 対戦相手の切断通知 (空ペイロード)。

    OpponentReconnectedMessage:
      type: object
      description: 対戦相手の再接続通知 (空ペイロード)。

    ServerUpdateMessage:
      type: object
      description: サーバー更新による接続終了の通知 (空ペイロード)。
