openapi: 3.0.3
info:
  title: overload-party-gateway
  version: 0.1.0
  description: |
    Gateway service の REST 契約 (client → gateway 公開 API)。
    本ファイルが SSoT。`packages/api-gateway` の Go 型は oapi-codegen が本ファイルから生成する。
    gateway は固有のドメインロジックを持たず、認証 / 観戦 / battle proxy / 静的データを提供する。
    各サービスの client 公開仕様は各サービスの openapi.yaml が SSoT。

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API ヘルスチェック
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      operationId: getVersion
      summary: アプリバージョン情報を取得
      responses:
        "200":
          description: バージョン情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          description: 設定ロード失敗

  /api/v1/auth/register:
    post:
      operationId: registerPlayer
      summary: 新規プレイヤー登録 (name はオンボーディング完了時に確定)
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "409":
          description: 既に登録済み

  /api/v1/auth/login:
    post:
      operationId: loginPlayer
      summary: 既存プレイヤーのログイン
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "404":
          description: プレイヤー未登録

  /api/v1/games/{gameId}/log:
    parameters:
      - $ref: "#/components/parameters/GameIdPath"
    get:
      operationId: getGameLog
      summary: ゲームログを JSON で取得 (battle サーバーにプロキシ)
      responses:
        "200":
          description: ゲームログ JSON (battle 由来)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: ゲームが存在しない
        "500":
          description: Battle サーバー接続エラー

  /api/v1/games/{gameId}/log/text:
    parameters:
      - $ref: "#/components/parameters/GameIdPath"
    get:
      operationId: getGameLogText
      summary: ゲームログをテキスト形式で取得
      responses:
        "200":
          description: ゲームログ (text/plain)
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: ゲームが存在しない

  /api/v1/npc/models:
    get:
      operationId: listNpcModels
      summary: NPC モデル一覧を取得 (battle サーバーにプロキシ)
      responses:
        "200":
          description: NPC モデル一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NpcModel"
        "404":
          description: NPC モデルが存在しない

  /api/v1/spectate/games:
    get:
      operationId: listSpectateGames
      summary: 観戦可能なアクティブゲーム一覧を取得
      responses:
        "200":
          description: 観戦可能ゲーム一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpectateGameInfo"

components:
  parameters:
    GameIdPath:
      name: gameId
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required: [minimumVersion, latestVersion, forceUpdate, storeUrl]
      properties:
        minimumVersion:
          type: string
          description: 最低要求バージョン
          x-go-name: MinimumVersion
        latestVersion:
          type: string
          description: 最新バージョン
          x-go-name: LatestVersion
        forceUpdate:
          type: boolean
          description: true の場合、クライアントはストアへ誘導する
          x-go-name: ForceUpdate
        storeUrl:
          type: string
          description: ストア URL
          x-go-name: StoreURL

    PlayerResponse:
      type: object
      required: [player_id, firebase_uid, level, exp, is_premium, created_at, updated_at, level_exp_current, level_exp_required]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        firebase_uid:
          type: string
          x-go-name: FirebaseUID
        name:
          type: string
          description: プレイヤー名 (オンボーディング未完了時は null)
        level:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        is_premium:
          type: boolean
        equipped_icon_no:
          type: integer
          format: int64
        selected_faction:
          type: string
        premium_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        level_exp_current:
          type: integer
          format: int64
          description: 現在レベル内の経験値
        level_exp_required:
          type: integer
          format: int64
          description: 次レベルまでの必要経験値

    NpcModel:
      type: object
      required: [model, faction, difficulty, display_name]
      properties:
        model:
          type: string
        faction:
          type: string
        difficulty:
          type: string
          description: 難易度 (`easy` / `hard`)
        display_name:
          type: string

    SpectateGameInfo:
      type: object
      required: [game_id, player1_id, player2_id, started_at]
      properties:
        game_id:
          type: string
          x-go-name: GameID
        player1_id:
          type: string
          x-go-name: Player1ID
        player2_id:
          type: string
          x-go-name: Player2ID
        started_at:
          type: string
          format: date-time
