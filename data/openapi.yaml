openapi: 3.0.3
info:
  title: overload-party-gateway
  version: 0.1.0
  description: |
    Gateway service の REST 契約 (client → gateway 公開 API)。
    本ファイルが SSoT。`packages/api-gateway` の Go 型は oapi-codegen が本ファイルから生成する。
    gateway は固有のドメインロジックを持たず、各下流サービス (account / card / shop / scenario / battle) からの応答を中継する。

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API ヘルスチェック
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      operationId: getVersion
      summary: アプリバージョン情報を取得
      responses:
        "200":
          description: バージョン情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          description: 設定ロード失敗

  /api/v1/announcements:
    get:
      operationId: listAnnouncements
      summary: アクティブなお知らせ一覧を取得 (有効期限内のみ)
      responses:
        "200":
          description: お知らせ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

  /api/v1/daily:
    get:
      operationId: getDailyTip
      summary: 今日の Tips を取得
      responses:
        "200":
          description: 本日の Tip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTip"

  /api/v1/cloud-news:
    get:
      operationId: listCloudNews
      summary: クラウドニュース記事一覧を取得 (ページネーション)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        "200":
          description: ニュース記事一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"
        "500":
          description: newsfeed テーブル読み取りエラー

  /api/v1/auth/register:
    post:
      operationId: registerPlayer
      summary: 新規プレイヤー登録 (name はオンボーディング完了時に確定)
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "409":
          description: 既に登録済み

  /api/v1/auth/login:
    post:
      operationId: loginPlayer
      summary: 既存プレイヤーのログイン
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "404":
          description: プレイヤー未登録

  /api/v1/player:
    get:
      operationId: getPlayer
      summary: 自分のプレイヤー情報を取得
      responses:
        "200":
          description: プレイヤー情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "404":
          description: プレイヤー未登録

  /api/v1/player/name:
    put:
      operationId: updatePlayerName
      summary: プレイヤー名を変更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerNameRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "400":
          description: name が空
        "404":
          description: プレイヤー未登録

  /api/v1/player/battle-limit:
    get:
      operationId: getBattleLimit
      summary: デイリーバトル残り回数を取得
      responses:
        "200":
          description: バトル制限情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleLimitResponse"

  /api/v1/player/cards:
    get:
      operationId: listPlayerCards
      summary: 所持カード一覧を取得
      responses:
        "200":
          description: 所持カード
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerCardWithDef"

  /api/v1/player/decks:
    get:
      operationId: listDecks
      summary: デッキ一覧を取得
      responses:
        "200":
          description: デッキ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deck"
    post:
      operationId: createDeck
      summary: 新規デッキ作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: バリデーションエラー (デッキ名・カード構成不正)

  /api/v1/player/decks/{deckId}:
    parameters:
      - $ref: "#/components/parameters/DeckIdPath"
    get:
      operationId: getDeck
      summary: デッキ詳細を取得 (カード構成付き)
      responses:
        "200":
          description: デッキ詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckDetailResponse"
        "400":
          description: deckId が不正
        "404":
          description: デッキが存在しない
    put:
      operationId: updateDeck
      summary: デッキ更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: バリデーションエラー
        "404":
          description: デッキが存在しない
    delete:
      operationId: deleteDeck
      summary: デッキ削除
      responses:
        "204":
          description: 削除成功
        "400":
          description: deckId が不正
        "404":
          description: デッキが存在しない

  /api/v1/player/settings:
    get:
      operationId: getPlayerSettings
      summary: プレイヤー設定を取得
      responses:
        "200":
          description: 設定情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSettings"
    put:
      operationId: updatePlayerSettings
      summary: プレイヤー設定を更新 (部分更新)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: 更新後の設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSettings"
        "400":
          description: バリデーションエラー

  /api/v1/cards:
    get:
      operationId: listAllCards
      summary: 全カード定義一覧を取得 (所持情報付き)
      responses:
        "200":
          description: カード一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerCardWithDef"

  /api/v1/games/{gameId}/log:
    parameters:
      - $ref: "#/components/parameters/GameIdPath"
    get:
      operationId: getGameLog
      summary: ゲームログを JSON で取得 (battle サーバーにプロキシ)
      responses:
        "200":
          description: ゲームログ JSON (battle 由来)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: ゲームが存在しない
        "500":
          description: Battle サーバー接続エラー

  /api/v1/games/{gameId}/log/text:
    parameters:
      - $ref: "#/components/parameters/GameIdPath"
    get:
      operationId: getGameLogText
      summary: ゲームログをテキスト形式で取得
      responses:
        "200":
          description: ゲームログ (text/plain)
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: ゲームが存在しない

  /api/v1/npc/models:
    get:
      operationId: listNpcModels
      summary: NPC モデル一覧を取得 (battle サーバーにプロキシ)
      responses:
        "200":
          description: NPC モデル一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NpcModel"
        "404":
          description: NPC モデルが存在しない

  /api/v1/spectate/games:
    get:
      operationId: listSpectateGames
      summary: 観戦可能なアクティブゲーム一覧を取得
      responses:
        "200":
          description: 観戦可能ゲーム一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpectateGameInfo"

  /api/v1/player/select-faction:
    post:
      operationId: selectFaction
      summary: ファクション選択 (初回無料、カード付与あり)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectFactionRequest"
      responses:
        "200":
          description: 選択成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectFactionResponse"
        "400":
          description: 不正なファクション名
        "409":
          description: 既に同じファクションを選択済み

  /api/v1/shop/products:
    get:
      operationId: listShopProducts
      summary: ショップ商品一覧を取得 (購入済みフラグ付き)
      responses:
        "200":
          description: 商品一覧 envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /api/v1/shop/purchase:
    post:
      operationId: purchaseProduct
      summary: 商品を購入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequest"
      responses:
        "200":
          description: 購入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          description: リクエスト不正
        "402":
          description: レシート検証失敗
        "404":
          description: 商品が存在しない
        "409":
          description: 既に購入済み

  /api/v1/shop/subscribe:
    post:
      operationId: subscribeProduct
      summary: プレミアムサブスクリプション開始
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequest"
      responses:
        "200":
          description: サブスク登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "400":
          description: リクエスト不正
        "402":
          description: レシート検証失敗

  /api/v1/scenarios:
    get:
      operationId: listScenarios
      summary: エピソード一覧を取得 (アンロック状態付き)
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            example: ja
      responses:
        "200":
          description: エピソード一覧 envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeListResponse"

  /api/v1/scenarios/{episodeId}/script:
    parameters:
      - $ref: "#/components/parameters/EpisodeIdPath"
    get:
      operationId: getScenarioScript
      summary: エピソードスクリプトを取得
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            example: ja
      responses:
        "200":
          description: スクリプト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioScriptResponse"
        "403":
          description: エピソード未アンロック
        "404":
          description: エピソードが存在しない

  /api/v1/scenarios/{episodeId}/complete:
    parameters:
      - $ref: "#/components/parameters/EpisodeIdPath"
    post:
      operationId: completeScenario
      summary: エピソードをクリア済みにする
      responses:
        "200":
          description: 完了登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioCompleteResponse"
        "403":
          description: エピソード未アンロック
        "404":
          description: エピソードが存在しない

  /api/v1/onboarding/status:
    get:
      operationId: getOnboardingStatus
      summary: オンボーディング完了状態を取得
      responses:
        "200":
          description: ステータス
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /api/v1/onboarding/script:
    get:
      operationId: getOnboardingScript
      summary: オンボーディングシナリオ本文を取得
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            example: ja
      responses:
        "200":
          description: スクリプト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingScriptResponse"
        "404":
          description: 要求言語のスクリプトが存在しない
        "409":
          description: 既にオンボーディング完了済み

  /api/v1/onboarding/resume:
    get:
      operationId: getOnboardingResume
      summary: 再開時の次の checkpoint を取得 (account の業務真実から導出)
      responses:
        "200":
          description: resume 情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResumeResponse"
        "404":
          description: プレイヤーが account に存在しない (Register 未実施)

  /api/v1/onboarding/name:
    put:
      operationId: setOnboardingName
      summary: オンボード内 name 入力ステップで表示名を確定 (scenario が account に同期書込で中継)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingNameRequest"
      responses:
        "204":
          description: 更新成功 (空 body)
        "400":
          description: name が account のバリデーションに違反

  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary: オンボーディング完了を記録し player-onboarded を発行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCompleteRequest"
      responses:
        "200":
          description: 完了登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCompleteResponse"
        "400":
          description: initial_faction_id の検証失敗
        "409":
          description: 既にオンボーディング完了済み

components:
  parameters:
    DeckIdPath:
      name: deckId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameIdPath:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    EpisodeIdPath:
      name: episodeId
      in: path
      required: true
      schema:
        type: string

  schemas:
    # ─── Health / version / static ────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required: [minimumVersion, latestVersion, forceUpdate, storeUrl]
      properties:
        minimumVersion:
          type: string
          description: 最低要求バージョン
          x-go-name: MinimumVersion
        latestVersion:
          type: string
          description: 最新バージョン
          x-go-name: LatestVersion
        forceUpdate:
          type: boolean
          description: true の場合、クライアントはストアへ誘導する
          x-go-name: ForceUpdate
        storeUrl:
          type: string
          description: ストア URL
          x-go-name: StoreURL

    Announcement:
      type: object
      required: [id, title, body, type, published_at]
      properties:
        id:
          type: string
          x-go-name: ID
          description: お知らせID
        title:
          type: string
        body:
          type: string
        type:
          $ref: "#/components/schemas/AnnouncementType"
        published_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    AnnouncementType:
      type: string
      description: お知らせの種別
      enum:
        - info
        - warning
        - maintenance

    DailyTip:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          x-go-name: ID
          description: TipID
        text:
          type: string

    NewsArticle:
      type: object
      required: [article_id, source, title, tags, fetched_at]
      properties:
        article_id:
          type: string
          x-go-name: ArticleID
        source:
          type: string
          description: ソース (`aws` / `google-cloud` / `azure` / `oci` / `other`)
        title:
          type: string
        summary:
          type: string
          description: AI 要約 (未完了の場合 null)
        tags:
          type: array
          items:
            type: string
        published_at:
          type: string
          format: date-time
        fetched_at:
          type: string
          format: date-time

    # ─── Player ──────────────────────────────────────────────────────
    PlayerResponse:
      type: object
      required: [player_id, firebase_uid, level, exp, is_premium, created_at, updated_at, level_exp_current, level_exp_required]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        firebase_uid:
          type: string
          x-go-name: FirebaseUID
        name:
          type: string
          description: プレイヤー名 (オンボーディング未完了時は null)
        level:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        is_premium:
          type: boolean
        equipped_icon_no:
          type: integer
          format: int64
        selected_faction:
          type: string
        premium_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        level_exp_current:
          type: integer
          format: int64
          description: 現在レベル内の経験値
        level_exp_required:
          type: integer
          format: int64
          description: 次レベルまでの必要経験値

    PlayerNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    BattleLimitResponse:
      type: object
      required: [daily_battle_count, daily_battle_limit, can_battle]
      properties:
        daily_battle_count:
          type: integer
          format: int64
        daily_battle_limit:
          type: integer
          format: int64
          description: -1 で無制限 (プレミアム会員)
        can_battle:
          type: boolean

    PlayerSettings:
      type: object
      required: [player_id, language, bgm_volume, se_volume, push_enabled, updated_at]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        language:
          type: string
          description: 言語 (`ja` / `en`)
        bgm_volume:
          type: integer
          format: int64
        se_volume:
          type: integer
          format: int64
        push_enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time

    UpdateSettingsRequest:
      type: object
      description: 部分更新。指定フィールドのみ更新される。
      properties:
        language:
          type: string
        bgm_volume:
          type: integer
          format: int64
        se_volume:
          type: integer
          format: int64
        push_enabled:
          type: boolean

    SelectFactionRequest:
      type: object
      required: [faction]
      properties:
        faction:
          type: string
          description: ファクション (`SHE` / `Tenki` / `Sugar` / `Tuners`)

    SelectFactionResponse:
      type: object
      required: [message, faction, cards_granted]
      properties:
        message:
          type: string
        faction:
          type: string
        cards_granted:
          type: integer
          format: int64

    # ─── Decks / cards ───────────────────────────────────────────────
    PlayerCardWithDef:
      type: object
      required: [card_id, art_no, count, card_name, resource_label, faction, card_type, deploy_turns, resizable, elastic, stats, restriction]
      properties:
        card_id:
          type: string
          x-go-name: CardID
        art_no:
          type: integer
          format: int64
        count:
          type: integer
          format: int32
        card_name:
          type: string
        resource_label:
          type: string
          description: リソースラベル (AWS/Azure/Google Cloud/Oracle 等のサービス名)
        faction:
          type: string
        card_type:
          type: string
        deploy_turns:
          type: integer
          format: int64
        resizable:
          type: boolean
        elastic:
          type: boolean
        stats:
          type: object
          additionalProperties: true
          description: ComputeStats または DataStats (downstream の型をそのまま中継)
        effect_text:
          type: string
        restriction:
          type: string
          description: 制限 (`unlimited` / `semi_limited` / `limited` / `forbidden`)

    Deck:
      type: object
      required: [player_id, deck_id, deck_name, is_valid, created_at, updated_at]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        deck_id:
          type: integer
          format: int64
          x-go-name: DeckID
        deck_name:
          type: string
        is_valid:
          type: boolean
          description: "バトル使用可能か (都度算出: 30 枚 + 全カード所持 + 制限枚数以内)"
        playmat_no:
          type: integer
          format: int64
        sleeve_no:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deck_cards:
          type: array
          items:
            $ref: "#/components/schemas/DeckCard"

    DeckCard:
      type: object
      required: [player_id, deck_id, card_id, art_no, count]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        deck_id:
          type: integer
          format: int64
          x-go-name: DeckID
        card_id:
          type: string
          x-go-name: CardID
        art_no:
          type: integer
          format: int64
        count:
          type: integer
          format: int32

    DeckDetailResponse:
      type: object
      required: [deck, cards]
      properties:
        deck:
          $ref: "#/components/schemas/Deck"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DeckCard"

    DeckCardEntry:
      type: object
      required: [card_id, art_no, count]
      properties:
        card_id:
          type: string
          x-go-name: CardID
        art_no:
          type: integer
          format: int64
        count:
          type: integer
          format: int32

    DeckCreateRequest:
      type: object
      required: [deck_name, cards]
      properties:
        deck_name:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DeckCardEntry"
        playmat_no:
          type: integer
          format: int64
        sleeve_no:
          type: integer
          format: int64

    DeckUpdateRequest:
      type: object
      required: [deck_name, cards]
      properties:
        deck_name:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DeckCardEntry"
        playmat_no:
          type: integer
          format: int64
        sleeve_no:
          type: integer
          format: int64

    # ─── Shop ────────────────────────────────────────────────────────
    ProductListResponse:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"

    ProductResponse:
      type: object
      required: [product_id, name, type, price, content, is_active, is_owned]
      properties:
        product_id:
          type: string
          x-go-name: ProductID
        name:
          type: string
        type:
          type: string
          description: 商品種別 (downstream shop の ProductType と一致)
        price:
          type: integer
          format: int64
        content:
          type: object
          additionalProperties: true
          description: 商品内容 (種別により構造が異なる、shop の生 JSON を中継)
        description:
          type: string
        image_url:
          type: string
          x-go-name: ImageURL
        is_active:
          type: boolean
        is_owned:
          type: boolean

    PurchaseRequest:
      type: object
      required: [product_id, platform, purchase_token]
      properties:
        product_id:
          type: string
          x-go-name: ProductID
        platform:
          type: string
          description: プラットフォーム (`ios` / `android`)
        purchase_token:
          type: string

    PurchaseResponse:
      type: object
      required: [message, product_id]
      properties:
        message:
          type: string
        product_id:
          type: string
          x-go-name: ProductID

    SubscribeResponse:
      type: object
      required: [message, expires_at]
      properties:
        message:
          type: string
        expires_at:
          type: string
          format: date-time

    # ─── Scenario ────────────────────────────────────────────────────
    EpisodeListResponse:
      type: object
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeWithStatus"

    EpisodeWithStatus:
      type: object
      required: [episode_id, episode_number, title, is_unlocked, is_completed, lock_reasons]
      properties:
        episode_id:
          type: string
          x-go-name: EpisodeID
        faction:
          type: string
        episode_number:
          type: integer
          format: int64
        title:
          type: string
        thumbnail_url:
          type: string
          x-go-name: ThumbnailURL
        is_unlocked:
          type: boolean
        is_completed:
          type: boolean
        lock_reasons:
          type: array
          items:
            $ref: "#/components/schemas/LockReason"

    LockReason:
      type: object
      required: [type, required]
      properties:
        type:
          type: string
          description: 条件種別 (`level` / `faction` / `episode`)
        required:
          description: 必要値 (種別により型が異なる)
        current:
          description: 現在値 (level の場合のみ)

    ScenarioScriptResponse:
      type: object
      required: [episode_id, script]
      properties:
        episode_id:
          type: string
          x-go-name: EpisodeID
        script:
          type: string

    ScenarioCompleteResponse:
      type: object
      required: [message, episode_id]
      properties:
        message:
          type: string
        episode_id:
          type: string
          x-go-name: EpisodeID

    # ─── Onboarding ──────────────────────────────────────────────────
    OnboardingStatus:
      type: object
      required: [player_id, onboarded]
      properties:
        player_id:
          type: string
          x-go-name: PlayerID
        onboarded:
          type: boolean
        completed_at:
          type: string
          format: date-time

    OnboardingScriptResponse:
      type: object
