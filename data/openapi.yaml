    OnboardingCompleteResponse:
      type: object
      required: [message, player_id]
      properties:
        message:
          type: string
        player_id:
          type: string
          x-go-name: PlayerID

    # ─── NPC / Spectate ──────────────────────────────────────────────
    NpcModel:
      type: object
      required: [model, faction, difficulty, display_name]
      properties:
        model:
          type: string
        faction:
          type: string
        difficulty:
          type: string
          description: 難易度 (`easy` / `hard`)
        display_name:
          type: string

    SpectateGameInfo:
      type: object
