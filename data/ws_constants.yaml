# Gateway WebSocket message type constants (SSoT).
#
# Owned by gateway conceptually (per ADR-015), but physically lives in common
# until gateway repo owns its own code-gen (ADR-011 / ADR-015 Phase 6).
#
# Per ADR-015 Phase 1, this file is split out of the former data/constants.yaml.
# Consumers: gateway (primary), client (for WS dispatch).
#
# Consumed by scripts/generate_types.py → packages/ws-constants/
#                                            → packages/ws-constants-npm/src/index.ts
# Note: no C# output — battle does not consume WS constants.

ws_message_types:
  server:
  - game_state
  - game_over
  - error
  - game_entered
  - matchmaking_started
  - matchmaking_cancelled
  - action_rejected
  - stamp_used
  - pong
  - match_found
  - action_performed
  - turn_controls
  - npc_battle_created
  - opponent_disconnected
  - opponent_reconnected
  - spectate_joined
  - spectate_error
  - spectate_update
  - spectate_ended
  - spectate_stamp_broadcast
  - game_state_restore
  - faction_selection_complete
  - premium_update_complete
  client:
  - game_enter
  - matchmaking_start
  - matchmaking_cancel
  - game_action
  - use_stamp
  - ping
  - npc_battle_start
  - spectate_join
  - spectate_leave
  - spectate_stamp
