# Model definitions for API contract types + card domain types shared across repositories.
# generate_types.py reads this file and routes each section to the correct Go module
# (per ADR-015 Phase 3) and TS package:
#
#   Go (scripts/generate_types.py:_GO_MODELS_ROUTING):
#     card / card_stats / passive_effect / npc_models → packages/card-types/
#     deck / rest_api / ws_messages                  → packages/api-client/
#     battle_gateway_rpc                             → packages/api-battle-rpc/
#     game_state_view                                 → Go skip (go_skip: true; battle consumes via C#)
#
#   TS (ADR-015 Phase 4 — 1:1 の npm package 分割済み):
#     card / card_stats / passive_effect / npc_models → packages/card-types-npm/src/models.ts
#     game_state_view                                 → packages/game-state-npm/src/models.ts
#     deck / rest_api / ws_messages                   → packages/api-client-npm/src/{models,wsMessages}.ts
#
# Fields:
#   target: "both" = gateway + battle, "gateway" = gateway only, "battle" = battle only
#   pkg:    legacy field from Phase 3 (TS routing now uses _TS_MODELS_ROUTING; Go routing uses _GO_MODELS_ROUTING)
#   Per-type fields: name (Go name), type (Go type string), json (json tag), db (optional db tag)

files:
  # ─── Deck ──────────────────────────────────────────────
  - name: deck
    target: both
    pkg: api
    imports:
      - encoding/json
      - time
    ts_imports:
      - {names: [CardType, FactionId, Restriction], from: "@kenyamaneko/overload-party-game-design-constants"}
      - {names: [CardStats], from: "@kenyamaneko/overload-party-card-types"}
    types:
      - name: PlayerCardWithDef
        comment: "PlayerCardWithDef is a PlayerCard enriched with card definition fields for API responses."
        fields:
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "所持枚数"}
          - {name: CardName, type: string, json: "card_name", doc: "カード名"}
          - {name: ResourceLabel, type: string, json: "resource_label", doc: "リソースラベル（AWS/Azure/Google Cloud/Oracle のサービス名）"}
          - {name: Faction, type: string, json: "faction", ts_type: "FactionId | 'Neutral'", doc: "ファクション（`SHE` / `Tenki` / `Sugar` / `Tuners` / `Neutral`）"}
          - {name: CardType, type: string, json: "card_type", ts_type: CardType, doc: "カード種別"}
          - {name: DeployTurns, type: int64, json: "deploy_turns", doc: "デプロイターン数（0=即時）"}
          - {name: Resizable, type: bool, json: "resizable", doc: "手動スケール可能か"}
          - {name: Elastic, type: bool, json: "elastic", doc: "自動スケール対応か"}
          - {name: Stats, type: json.RawMessage, json: "stats", ts_type: CardStats, doc: "スタッツ（ComputeStats または DataStats）"}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty", doc: "エフェクト説明テキスト"}
          - {name: Restriction, type: string, json: "restriction", ts_type: Restriction, doc: "制限（`unlimited` / `semi_limited` / `limited` / `forbidden`）"}

      - name: Deck
        comment: "Deck is the API response for a player's deck with optional card list."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキID（自動採番）"}
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: IsValid, type: bool, json: "is_valid", doc: "バトル使用可能か（都度算出: 30枚 + 全カード所持 + 制限枚数以内）"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号（null: デフォルト）"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号（null: デフォルト）"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}
          - {name: DeckCards, type: "[]DeckCard", json: "deck_cards,omitempty", comment: "Populated by the service layer for API responses.", doc: "デッキのカード構成（`card_id`, `art_no`, `count`）"}

      - name: DeckCard
        comment: "DeckCard is a single card entry within a deck."
        fields:
          - {name: PlayerID, type: string, json: "player_id", doc: "プレイヤーID"}
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキID"}
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "枚数"}

  # ─── Card ──────────────────────────────────────────────
  - name: card
    target: both
    pkg: gamedata
    imports:
      - encoding/json
      - time
    types:
      - name: CardDefinition
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: CardName, type: string, json: "card_name"}
          - {name: ResourceLabel, type: string, json: "resource_label"}
          - {name: Faction, type: string, json: "faction"}
          - {name: CardType, type: string, json: "card_type"}
          - {name: DeployTurns, type: int64, json: "deploy_turns"}
          - {name: Resizable, type: bool, json: "resizable"}
          - {name: Elastic, type: bool, json: "elastic"}
          - {name: ElasticIncrement, type: int64, json: "elastic_increment,omitempty"}
          - {name: FreeTier, type: int64, json: "free_tier,omitempty", ts_type: boolean, ts_optional: false}
          - {name: CostPerRequest, type: int64, json: "cost_per_request,omitempty"}
          - {name: Stats, type: json.RawMessage, json: "stats", ts_type: CardStats}
          - {name: EffectText, type: "*string", json: "effect_text,omitempty", ts_type: string, ts_optional: false}
          - {name: Effects, type: json.RawMessage, json: "effects,omitempty", ts_type: "string[]", ts_optional: false}
          - {name: PassiveEffects, type: "[]PassiveEffect", json: "passive_effects,omitempty", ts_type: "string[]", ts_optional: false}
          - {name: PlatformEffects, type: "[]PlatformEffect", json: "platform_effects,omitempty", ts_type: "string[]", ts_optional: false}
          - {name: AttachmentEffects, type: "[]AttachmentEffect", json: "attachment_effects,omitempty", ts_type: "string[]", ts_optional: false}
          - {name: Restriction, type: string, json: "restriction"}
          - {name: IsActive, type: bool, json: "is_active"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}

  # ─── Card Stats ────────────────────────────────────────
  - name: card_stats
    target: both
    pkg: gamedata
    ts_type_aliases:
      - {name: CardStats, value: "ComputeStats | DataStats"}
    types:
      - name: ComputeStats
        comment: "ComputeStats for Compute, Container, Orchestrator, Serverless, AI/ML card types."
        fields:
          - {name: Throughput, type: int64, json: "throughput"}
          - {name: ThroughputMax, type: "*int64", json: "throughput_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

      - name: DataStats
        comment: "DataStats for Database, ObjectStorage, CacheDB card types."
        fields:
          - {name: Yield, type: int64, json: "yield"}
          - {name: YieldMax, type: "*int64", json: "yield_max,omitempty"}
          - {name: Availability, type: int64, json: "availability"}
          - {name: MaintenanceCost, type: int64, json: "maintenance_cost"}
          - {name: SLAPenalty, type: int64, json: "sla_penalty"}

  # ─── Passive / Platform / Attachment Effects ───────────
  - name: passive_effect
    target: both
    pkg: gamedata
    type_aliases:
      - {name: PassiveEffectType, base: string}
      - {name: PlatformEffectType, base: string}
      - {name: AttachmentEffectType, base: string}
    constants:
      - type: PassiveEffectType
        values:
          - {name: PassiveTPPerBackendDB, value: "tp_per_backend_db"}
          - {name: PassiveTPPerBackendData, value: "tp_per_backend_data"}
          - {name: PassiveTPIfCardTypeOnField, value: "tp_if_card_type_on_field"}
          - {name: PassiveYieldPerOtherDB, value: "dv_per_other_db"}
          - {name: PassiveYieldIfCardOnField, value: "dv_if_card_on_field"}
          - {name: PassiveAVBonus, value: "av_bonus"}
          - {name: PassiveScaleCostFree, value: "scale_cost_free"}
      - type: PlatformEffectType
        values:
          - {name: PlatformTPBonus, value: "tp_bonus"}
          - {name: PlatformYieldBonus, value: "yield_bonus"}
          - {name: PlatformAVBonus, value: "av_bonus"}
      - type: AttachmentEffectType
        values:
          - {name: AttachmentStatBonus, value: "stat_bonus"}
    types:
      - name: PassiveEffect
        fields:
          - {name: Type, type: PassiveEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: PlatformEffect
        fields:
          - {name: Type, type: PlatformEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: AttachmentEffect
        fields:
          - {name: Type, type: AttachmentEffectType, json: "type"}
          - {name: Params, type: "map[string]interface{}", json: "params"}

      - name: PassiveEffectConfig
        fields:
          - {name: Faction, type: string, json: "faction,omitempty"}
          - {name: CardTypes, type: "[]string", json: "card_types,omitempty"}
          - {name: BonusPerCard, type: int64, json: "bonus_per_card,omitempty"}
          - {name: FlatBonus, type: int64, json: "flat_bonus,omitempty"}
          - {name: MultiModelCardIDs, type: "[]string", json: "multi_model_card_ids,omitempty"}
          - {name: SpecificCardIDs, type: "[]string", json: "specific_card_ids,omitempty"}
          - {name: Zone, type: string, json: "zone,omitempty"}
          - {name: ExcludeSelf, type: bool, json: "exclude_self,omitempty"}

      - name: PlatformEffectConfig
        fields:
          - {name: TargetFaction, type: string, json: "target_faction,omitempty"}
          - {name: TargetCardTypes, type: "[]string", json: "target_card_types,omitempty"}
          - {name: Bonus, type: int64, json: "bonus,omitempty"}
          - {name: Reduction, type: int64, json: "reduction,omitempty"}
          - {name: ApplyToSelf, type: bool, json: "apply_to_self,omitempty"}

      - name: AttachmentEffectConfig
        fields:
          - {name: StatType, type: string, json: "stat_type"}
          - {name: Bonus, type: int64, json: "bonus"}

  # ─── WebSocket Messages (Gateway + Client) ─────────────
  # Shared message payloads for WebSocket communication.
  # Go: used as-is in handler/ws. TS: generated as interfaces.
  # ActionPerformedMessage is excluded (TS uses generics + ClientGameState).
  - name: ws_messages
    target: gateway
    pkg: api
    imports:
      - encoding/json
    ts_imports:
      - {names: [ClientGameState], from: "@kenyamaneko/overload-party-game-state"}
    types:
      # Client -> Server
      - name: MatchmakingStartMessage
        fields:
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキ ID"}

      - name: GameEnterMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID（ULID）"}
          - {name: DeckID, type: int64, json: "deck_id", doc: "デッキ ID"}

      - name: NPCBattleStartMessage
        fields:
          - {name: DeckID, type: int64, json: "deck_id", doc: "プレイヤーのデッキ ID"}
          - {name: NPCModel, type: string, json: "npc_model", doc: "`/npc/models` で取得した NPC モデル ID"}

      - name: GameActionMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: ActionType, type: string, json: "action_type", doc: "アクション種別"}
          - {name: Data, type: json.RawMessage, json: "data", doc: "アクション固有データ"}

      - name: UseStampMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: StampNo, type: int64, json: "stamp_no", doc: "スタンプ番号"}

      # Server -> Client
      - name: ErrorMessage
        fields:
          - {name: Code, type: string, json: "error_code", doc: "エラーコード"}
          - {name: Message, type: string, json: "message", doc: "エラー詳細メッセージ"}
          - {name: Retryable, type: bool, json: "retryable", doc: "リトライ可能か"}

      - name: MatchFoundMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID（ULID）"}

      - name: GameOverMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: WinningPlayerNum, type: int64, json: "winning_player_num", doc: "勝者のプレイヤー番号（1 or 2）"}
          - {name: WinReason, type: string, json: "win_reason", doc: "勝因"}

      - name: ActionRejectedMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: ActionType, type: string, json: "action_type", doc: "拒否されたアクション種別"}
          - {name: Reason, type: string, json: "reason", doc: "拒否理由"}

      - name: ActionPerformedMessage
        comment: "ActionPerformedMessage notifies a player of an action and the resulting state."
        fields:
          - {name: Sequence, type: int64, json: "sequence", doc: "シーケンス番号"}
          - {name: ActionType, type: string, json: "action_type", doc: "実行されたアクション種別（`play_card`, `attack`, `scale_up`, `use_effect`, `monetize`, `end_phase`, `discard_hand`, `battle_start`, `turn_start`）"}
          - {name: ActionData, type: json.RawMessage, json: "action_data", doc: "アクションの詳細データ（アクション種別により構造が異なる）"}
          - {name: State, type: json.RawMessage, json: "state", ts_type: ClientGameState, doc: "アクション実行後のゲーム状態（情報隠蔽適用済み）"}

      - name: StampUsedMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: PlayerNum, type: int64, json: "player_num", doc: "送信したプレイヤー番号（1 or 2）"}
          - {name: StampNo, type: int64, json: "stamp_no", doc: "スタンプ番号"}

      - name: NPCBattleCreatedMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID（ULID）"}

      # Spectate: Client -> Server
      - name: SpectateJoinMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "観戦対象のゲームID"}

      - name: SpectateLeaveMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "離脱するゲームID"}

      - name: SpectateStampMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: StampNo, type: int64, json: "stamp_no", doc: "スタンプ番号"}

      # Spectate: Server -> Client
      - name: SpectateJoinedMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: Player1Name, type: string, json: "player1_name", doc: "プレイヤー1 表示名"}
          - {name: Player1Level, type: int64, json: "player1_level", doc: "プレイヤー1 レベル"}
          - {name: Player2Name, type: string, json: "player2_name", doc: "プレイヤー2 表示名（NPC の場合は NPC モデル表示名）"}
          - {name: Player2Level, type: int64, json: "player2_level", doc: "プレイヤー2 レベル（NPC の場合は 0）"}
          - {name: State, type: json.RawMessage, json: "state", ts_type: ClientGameState, doc: "現在のゲーム状態（観戦者視点）"}

      - name: SpectateErrorMessage
        fields:
          - {name: Code, type: string, json: "error_code", doc: "エラーコード"}
          - {name: Message, type: string, json: "message", doc: "エラー詳細メッセージ"}

      - name: SpectateEndedMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: WinningPlayerNum, type: int64, json: "winning_player_num", doc: "勝者のプレイヤー番号"}
          - {name: WinReason, type: string, json: "win_reason", doc: "勝因"}

      - name: SpectateStampBroadcastMessage
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID"}
          - {name: SpectatorID, type: string, json: "spectator_id", doc: "スタンプ送信した観戦者ID"}
          - {name: StampNo, type: int64, json: "stamp_no", doc: "スタンプ番号"}

      # Opponent connection status (Server -> Client, no payload)
      - name: OpponentDisconnectedMessage
        fields: []

      - name: OpponentReconnectedMessage
        fields: []

  # ─── Battle ↔ Gateway RPC (internal envelope) ─────────
  # Envelope types for the internal REST contract between Gateway (Go) and
  # Battle (C#). Gateway treats game state / event_data as raw JSON pass-through.
  # Go struct tags are snake_case; C# uses explicit [JsonPropertyName("snake_case")].
  - name: battle_gateway_rpc
    target: both
    pkg: api
    ts_skip: true
    imports:
      - encoding/json
    types:
      # ── Response types ──
      - name: BattleDeckCard
        comment: "BattleDeckCard is a single card entry in a deck snapshot sent to the battle server."
        fields:
          - {name: CardID, type: string, json: "card_id"}
          - {name: ArtNo, type: int64, json: "art_no"}

      - name: GameCreatedResult
        comment: "GameCreatedResult is returned when a new game (NPC or PvP) is created on the battle server."
        fields:
          - {name: GameID, type: string, json: "game_id"}

      - name: ActionEvent
        comment: "ActionEvent is a single game event emitted by the battle server after an action."
        fields:
          - {name: Sequence, type: int64, json: "sequence"}
          - {name: EventType, type: string, json: "event_type"}
          - {name: PlayerNum, type: "*int64", json: "player_num", doc: "アクション元のスロット番号（1 or 2）。system event (turn_start) では null"}
          - {name: EventData, type: json.RawMessage, json: "event_data"}
          - {name: State, type: json.RawMessage, json: "state"}

      - name: ActionResult
        comment: "ActionResult is returned after a game action is processed by the battle server."
        fields:
          - {name: GameOver, type: bool, json: "game_over", doc: "ゲーム終了フラグ"}
          - {name: WinningPlayerNum, type: int64, json: "winning_player_num", doc: "勝者プレイヤー番号（1 or 2、未終了時は 0）"}
          - {name: WinReason, type: string, json: "win_reason", doc: "終了理由（WinReasons enum の文字列、未終了時は空文字）"}
          - {name: NpcPending, type: bool, json: "npc_pending", doc: "true の場合、Gateway は AdvanceNpcTurn を呼んで次の NPC アクションを取得する必要がある"}
          - {name: Events, type: "[]ActionEvent", json: "events", doc: "このアクションで発生したイベント列"}

      # ── Request types ──
      - name: NpcBattleRequest
        comment: "NpcBattleRequest is the request body for POST /api/v1/games/npc."
        fields:
          - {name: DeckCards, type: "[]BattleDeckCard", json: "deck_cards"}
          - {name: NpcModel, type: string, json: "npc_model"}

      - name: PvpBattleRequest
        comment: "PvpBattleRequest is the request body for POST /api/v1/games/pvp."
        fields:
          - {name: Deck1Cards, type: "[]BattleDeckCard", json: "deck1_cards"}
          - {name: Deck2Cards, type: "[]BattleDeckCard", json: "deck2_cards"}

      - name: GameActionRequest
        comment: "GameActionRequest is the request body for POST /api/v1/games/{gameId}/actions."
        fields:
          - {name: PlayerNum, type: int64, json: "player_num"}
          - {name: ActionType, type: string, json: "action_type"}
          - {name: Data, type: json.RawMessage, json: "data"}

  # ─── REST API (Gateway -> Client) ────────────────────────
  - name: rest_api
    target: gateway
    pkg: api
    imports:
      - encoding/json
      - time
    ts_imports:
      - {names: [CloudNewsSource], from: "@kenyamaneko/overload-party-newsfeed-constants"}
      - {names: [ProductType], from: "@kenyamaneko/overload-party-shop-constants"}
    types:
      # ── Response types ──
      - name: VersionResponse
        comment: "VersionResponse is the API response for GET /version."
        fields:
          - {name: MinimumVersion, type: string, json: "minimumVersion", doc: "最低要求バージョン"}
          - {name: LatestVersion, type: string, json: "latestVersion", doc: "最新バージョン"}
          - {name: ForceUpdate, type: bool, json: "forceUpdate", doc: "`true` の場合、クライアントはストアへ誘導する"}
          - {name: StoreUrl, type: string, json: "storeUrl", doc: "ストア URL"}

      - name: PlayerResponse
        comment: "PlayerResponse is the API response for GET /player."
        fields:
          - {name: PlayerID, type: string, json: "player_id", doc: "プレイヤーID（UUID）"}
          - {name: FirebaseUID, type: string, json: "firebase_uid", doc: "Firebase UID"}
          - {name: Name, type: "*string", json: "name,omitempty", doc: "プレイヤー名（オンボーディング未完了時は null）"}
          - {name: Level, type: int64, json: "level", doc: "プレイヤーレベル"}
          - {name: Exp, type: int64, json: "exp", doc: "累計経験値"}
          - {name: IsPremium, type: bool, json: "is_premium", doc: "プレミアム会員か"}
          - {name: EquippedIconNo, type: "*int64", json: "equipped_icon_no,omitempty", doc: "装備中のアイコン番号"}
          - {name: SelectedFaction, type: "*string", json: "selected_faction,omitempty", doc: "選択済みファクション"}
          - {name: PremiumExpiresAt, type: "*time.Time", json: "premium_expires_at,omitempty", doc: "プレミアム有効期限"}
          - {name: CreatedAt, type: time.Time, json: "created_at", doc: "登録日時"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at", doc: "最終更新日時"}
          - {name: LevelExpCurrent, type: int64, json: "level_exp_current", doc: "現在レベル内の経験値"}
          - {name: LevelExpRequired, type: int64, json: "level_exp_required", doc: "次レベルまでの必要経験値"}

      - name: BattleLimitResponse
        comment: "BattleLimitResponse is the API response for GET /player/battle-limit."
        fields:
          - {name: DailyBattleCount, type: int64, json: "daily_battle_count", doc: "本日のバトル回数"}
          - {name: DailyBattleLimit, type: int64, json: "daily_battle_limit", doc: "デイリーバトル上限（`-1` で無制限 = プレミアム会員）"}
          - {name: CanBattle, type: bool, json: "can_battle", doc: "バトル可能か"}

      - name: PlayerSettings
        comment: "PlayerSettings holds per-player application settings."
        fields:
          - {name: PlayerID, type: string, json: "player_id", doc: "プレイヤーID"}
          - {name: Language, type: string, json: "language", doc: "言語（`ja` / `en`）"}
          - {name: BgmVolume, type: int64, json: "bgm_volume", doc: "BGM 音量（0-100）"}
          - {name: SeVolume, type: int64, json: "se_volume", doc: "SE 音量（0-100）"}
          - {name: PushEnabled, type: bool, json: "push_enabled", doc: "プッシュ通知の有効/無効"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at", doc: "最終更新日時"}

      - name: ProductResponse
        comment: "ProductResponse is the API response for a purchasable item in the shop."
        fields:
          - {name: ProductID, type: string, json: "product_id", doc: "商品ID"}
          - {name: Name, type: string, json: "name", doc: "商品名"}
          - {name: Type, type: string, json: "type", ts_type: ProductType, doc: "商品種別（`faction_set` / `cosmetic` / `subscription`）"}
          - {name: Price, type: int64, json: "price", doc: "価格（円）"}
          - {name: Content, type: json.RawMessage, json: "content", doc: "商品内容（種別により構造が異なる）"}
          - {name: Description, type: "*string", json: "description,omitempty", doc: "商品説明"}
          - {name: ImageURL, type: "*string", json: "image_url,omitempty", doc: "商品画像 URL"}
          - {name: IsActive, type: bool, json: "is_active", doc: "販売中か"}
          - {name: IsOwned, type: bool, json: "is_owned", doc: "購入済みか"}

      - name: EpisodeWithStatus
        comment: "EpisodeWithStatus is the API response for a single episode with unlock status."
        fields:
          - {name: EpisodeID, type: string, json: "episode_id", doc: "エピソードID"}
          - {name: Faction, type: "*string", json: "faction", doc: "ファクション名"}
          - {name: EpisodeNumber, type: int64, json: "episode_number", doc: "エピソード番号"}
          - {name: Title, type: string, json: "title", doc: "エピソードタイトル"}
          - {name: ThumbnailURL, type: "*string", json: "thumbnail_url", doc: "サムネイル画像 URL"}
          - {name: IsUnlocked, type: bool, json: "is_unlocked", doc: "アンロック済みか"}
          - {name: IsCompleted, type: bool, json: "is_completed", doc: "クリア済みか"}
          - {name: LockReasons, type: "[]LockReason", json: "lock_reasons", doc: "未達のアンロック条件（アンロック済みの場合は空配列）"}

      - name: LockReason
        comment: "LockReason describes a single unmet unlock condition for an episode."
        fields:
          - {name: Type, type: string, json: "type", ts_type: "'level' | 'faction' | 'episode'", doc: "条件種別（`level` / `faction` / `episode`）"}
          - {name: Required, type: "interface{}", json: "required", doc: "必要値（種別により型が異なる）"}
          - {name: Current, type: "interface{}", json: "current,omitempty", doc: "現在値（`level` の場合のみ）"}

      - name: NewsArticle
        comment: "NewsArticle is the API response for a news article."
        fields:
          - {name: ArticleID, type: string, json: "article_id", doc: "記事 ULID"}
          - {name: Source, type: string, json: "source", ts_type: CloudNewsSource, doc: "ソース（`aws` / `google-cloud` / `azure` / `oci` / `other`）"}
          - {name: Title, type: string, json: "title", doc: "記事タイトル"}
          - {name: Summary, type: "*string", json: "summary,omitempty", doc: "AI 要約（未完了の場合 null）"}
          - {name: Tags, type: "[]string", json: "tags", doc: "タグ配列"}
          - {name: PublishedAt, type: "*time.Time", json: "published_at,omitempty", doc: "記事の公開日時"}
          - {name: FetchedAt, type: time.Time, json: "fetched_at", doc: "取得日時"}

      - name: Announcement
        comment: "Announcement represents a single announcement entry."
        fields:
          - {name: ID, type: string, json: "id", doc: "お知らせID"}
          - {name: Title, type: string, json: "title", doc: "タイトル"}
          - {name: Body, type: string, json: "body", doc: "本文"}
          - {name: Type, type: string, json: "type", ts_type: "'info' | 'warning' | 'maintenance'", doc: "種別（`info` / `warning` / `maintenance`）"}
          - {name: PublishedAt, type: time.Time, json: "published_at", doc: "公開日時"}
          - {name: ExpiresAt, type: "*time.Time", json: "expires_at,omitempty", doc: "有効期限"}

      - name: DailyTip
        comment: "DailyTip represents a single daily tip entry."
        fields:
          - {name: ID, type: string, json: "id", doc: "TipID"}
          - {name: Text, type: string, json: "text", doc: "Tip テキスト"}

      - name: SpectateGameInfo
        comment: "SpectateGameInfo is the public view of an active game for the spectate list API."
        fields:
          - {name: GameID, type: string, json: "game_id", doc: "ゲームID（ULID）"}
          - {name: Player1ID, type: string, json: "player1_id", doc: "プレイヤー1 ID"}
          - {name: Player2ID, type: string, json: "player2_id", doc: "プレイヤー2 ID"}
          - {name: StartedAt, type: time.Time, json: "started_at", doc: "ゲーム開始日時"}

      # ── Request types ──
      - name: DeckCardEntry
        comment: "DeckCardEntry represents a card entry in a deck create/update request."
        fields:
          - {name: CardID, type: string, json: "card_id", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "art_no", doc: "アート番号"}
          - {name: Count, type: int, json: "count", doc: "枚数"}

      # NOTE: DeckCreateRequest と DeckUpdateRequest は現在同一フィールドだが、
      # 将来の分岐（例: Update での部分更新対応）に備えて型を分離している。
      - name: DeckCreateRequest
        comment: "DeckCreateRequest is the request body for POST /decks."
        fields:
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards", doc: "デッキのカード構成"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号"}

      - name: DeckUpdateRequest
        comment: "DeckUpdateRequest is the request body for PUT /decks/:id."
        fields:
          - {name: DeckName, type: string, json: "deck_name", doc: "デッキ名"}
          - {name: Cards, type: "[]DeckCardEntry", json: "cards", doc: "デッキのカード構成"}
          - {name: PlaymatNo, type: "*int64", json: "playmat_no,omitempty", doc: "プレイマット番号"}
          - {name: SleeveNo, type: "*int64", json: "sleeve_no,omitempty", doc: "スリーブ番号"}

      - name: UpdateSettingsRequest
        comment: "UpdateSettingsRequest is the request body for PUT /player/settings. 部分更新。指定フィールドのみ更新される。"
        fields:
          - {name: Language, type: "*string", json: "language,omitempty", doc: "言語（`ja` / `en`）"}
          - {name: BgmVolume, type: "*int64", json: "bgm_volume,omitempty", doc: "BGM 音量（0-100）"}
          - {name: SeVolume, type: "*int64", json: "se_volume,omitempty", doc: "SE 音量（0-100）"}
          - {name: PushEnabled, type: "*bool", json: "push_enabled,omitempty", doc: "プッシュ通知の有効/無効"}

      - name: PurchaseRequest
        comment: "PurchaseRequest is the request body for POST /shop/purchase."
        fields:
          - {name: ProductID, type: string, json: "product_id", doc: "商品ID"}
          - {name: Platform, type: string, json: "platform", doc: "プラットフォーム（`ios` / `android`）"}
          - {name: PurchaseToken, type: string, json: "purchase_token", doc: "購入トークン"}

      - name: PlayerNameRequest
        comment: "PlayerNameRequest is the request body for PUT /player/name."
        fields:
          - {name: Name, type: string, json: "name", doc: "新しいプレイヤー名"}

      - name: SelectFactionRequest
        comment: "SelectFactionRequest is the request body for POST /player/select-faction."
        fields:
          - {name: Faction, type: string, json: "faction", doc: "ファクション（`SHE` / `Tenki` / `Sugar` / `Tuners`）"}

      - name: DeckDetailResponse
        comment: "DeckDetailResponse is the API response for GET /player/decks/{deckId}."
        fields:
          - {name: Deck, type: Deck, json: "deck", doc: "デッキ本体"}
          - {name: Cards, type: "[]DeckCard", json: "cards", doc: "デッキ内のカード一覧"}

      - name: ScenarioScriptResponse
        comment: "ScenarioScriptResponse is the API response for GET /scenarios/{episodeId}/script."
        fields:
          - {name: EpisodeID, type: string, json: "episode_id", doc: "エピソードID"}
          - {name: Script, type: string, json: "script", doc: "スクリプト（`.ks` 形式）"}

      - name: ScenarioCompleteResponse
        comment: "ScenarioCompleteResponse is the API response for POST /scenarios/{episodeId}/complete."
        fields:
          - {name: Message, type: string, json: "message", doc: "結果メッセージ"}
          - {name: EpisodeID, type: string, json: "episode_id", doc: "エピソードID"}

      - name: SelectFactionResponse
        comment: "SelectFactionResponse is the API response for POST /player/select-faction."
        fields:
          - {name: Message, type: string, json: "message", doc: "結果メッセージ"}
          - {name: Faction, type: string, json: "faction", doc: "選択されたファクション"}
          - {name: CardsGranted, type: int64, json: "cards_granted", doc: "付与されたカード枚数"}

      - name: PurchaseResponse
        comment: "PurchaseResponse is the API response for POST /shop/purchase."
        fields:
          - {name: Message, type: string, json: "message", doc: "結果メッセージ"}
          - {name: ProductID, type: string, json: "product_id", doc: "購入した商品ID"}

      - name: SubscribeResponse
        comment: "SubscribeResponse is the API response for POST /shop/subscribe."
        fields:
          - {name: Message, type: string, json: "message", doc: "結果メッセージ"}
          - {name: ExpiresAt, type: time.Time, json: "expires_at", doc: "サブスクリプション有効期限"}

  # ─── NPC Models (Battle → Client) ───────────────────────
  - name: npc_models
    target: both
    pkg: gamedata
    types:
      - name: NpcModel
        comment: "NpcModel is a single NPC model entry in GET /npc/models response."
        fields:
          - {name: Model, type: string, json: "model", doc: "NPC モデル ID。`npc_battle_start` で使用する"}
          - {name: Faction, type: string, json: "faction", doc: "ファクション名"}
          - {name: Difficulty, type: string, json: "difficulty", doc: "難易度（`easy` / `hard`）"}
          - {name: DisplayName, type: string, json: "display_name", doc: "NPC の表示名"}

  # ─── Game State View (Battle → Client) ─────────────────
  # JSON keys use C# ASP.NET CamelCase convention (first char lowercase).
  # Nullable pointer fields without omitempty are emitted as optional in TS
  # (C# serializes them with WhenWritingNull, so they may be absent).
  - name: game_state_view
    target: both
    pkg: gamedata
    go_skip: true
    nullable_as_optional: true
    imports:
      - time
    ts_imports:
      - {names: [AvailableAction], from: "./variantTypes"}
      - {names: [InstanceFamily, Rank], from: "@kenyamaneko/overload-party-game-design-constants"}
      - {names: [EffectDuration, GamePhase], from: "@kenyamaneko/overload-party-game-logic-constants"}
    types:
      - name: ClientGameState
        fields:
          - {name: GameID, type: string, json: "gameID", doc: "ゲームID（ULID）"}
          - {name: CurrentTurn, type: int64, json: "currentTurn", doc: "現在のターン番号"}
          - {name: CurrentPhase, type: string, json: "currentPhase", ts_type: GamePhase, doc: "現在のフェーズ（`selecting` / `draw` / `yield` / `main` / `battle` / `end`）"}
          - {name: ActivePlayer, type: int64, json: "activePlayer", doc: "アクティブプレイヤー番号（1 or 2）"}
          - {name: IsMyTurn, type: bool, json: "isMyTurn", doc: "自分のターンか"}
          - {name: TurnStartedAt, type: time.Time, json: "turnStartedAt", doc: "ターン開始日時"}
          - {name: MyView, type: PlayerView, json: "myView", doc: "自分の視点"}
          - {name: OppView, type: OpponentView, json: "oppView", doc: "相手の視点（情報秘匿適用済み）"}

      - name: PlayerView
        fields:
          - {name: PlayerNum, type: int64, json: "playerNum", doc: "プレイヤー番号（1 or 2）"}
          - {name: Budget, type: int64, json: "budget", doc: "予算"}
          - {name: InsightPool, type: int64, json: "insightPool", doc: "Insight プール"}
          - {name: TimeBank, type: int64, json: "timeBank", doc: "タイムバンク（秒）"}
          - {name: Field, type: Field, json: "field", doc: "フィールド（Frontend/Backend/Support）"}
          - {name: Hand, type: "[]UndeployedCard", json: "hand", doc: "手札"}
          - {name: RepoCount, type: int, json: "repoCount", doc: "リポジトリ残り枚数"}
          - {name: TrashCount, type: int, json: "trashCount", doc: "トラッシュ枚数"}
          - {name: Trash, type: "[]UndeployedCard", json: "trash", doc: "トラッシュ"}
          - {name: AvailableActions, type: "[]AvailableAction", json: "availableActions,omitempty", doc: "実行可能アクション一覧（アクティブプレイヤーのみ）"}

      - name: OpponentView
        fields:
          - {name: PlayerNum, type: int64, json: "playerNum", doc: "プレイヤー番号"}
          - {name: Budget, type: int64, json: "budget", doc: "予算"}
          - {name: InsightPool, type: int64, json: "insightPool", doc: "Insight プール"}
          - {name: TimeBank, type: int64, json: "timeBank", doc: "タイムバンク（秒）"}
          - {name: Field, type: OpponentField, json: "field", doc: "フィールド（サポートは非公開カード隠蔽）"}
          - {name: HandCount, type: int, json: "handCount", doc: "手札枚数（内容は非公開）"}
          - {name: RepoCount, type: int, json: "repoCount", doc: "リポジトリ残り枚数"}
          - {name: TrashCount, type: int, json: "trashCount", doc: "トラッシュ枚数"}
          - {name: Trash, type: "[]UndeployedCard", json: "trash", doc: "トラッシュ"}

      - name: Field
        comment: "Field represents one player's complete field layout."
        fields:
          - {name: Frontend, type: "[]*DeployedResource", json: "frontend", doc: "フロントゾーン（3スロット）"}
          - {name: Backend, type: "[]*DeployedResource", json: "backend", doc: "バックエンドゾーン（3スロット）"}
          - {name: Support, type: "[]*DeployedSupport", json: "support", doc: "サポートゾーン（3スロット）"}

      - name: OpponentField
        comment: "Opponent's field with reactive cards hidden."
        fields:
          - {name: Frontend, type: "[]*DeployedResource", json: "frontend", doc: "フロントゾーン（3スロット）"}
          - {name: Backend, type: "[]*DeployedResource", json: "backend", doc: "バックエンドゾーン（3スロット）"}
          - {name: Support, type: "[]*HiddenDeployedSupport", json: "support", doc: "サポートゾーン（非公開カードは隠蔽）"}

      - name: DeployedResource
        fields:
          - {name: InstanceID, type: string, json: "instanceID", doc: "インスタンスID"}
          - {name: CardID, type: string, json: "cardID", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "artNo", doc: "アート番号"}
          - {name: Rank, type: "*string", json: "rank", ts_type: Rank, doc: "ランク（S/M/L/XL）"}
          - {name: InstanceFamily, type: "*string", json: "instanceFamily", ts_type: InstanceFamily, doc: "インスタンスファミリー"}
          - {name: FaceUp, type: bool, json: "faceUp", doc: "表向きか"}
          - {name: DeployingTurnsLeft, type: int64, json: "deployingTurnsLeft", doc: "デプロイ残りターン数（0=アクティブ）"}
          - {name: CurrentAV, type: int64, json: "currentAV", doc: "現在の可用性"}
          - {name: MaxAV, type: int64, json: "maxAV", doc: "最大可用性"}
          - {name: CurrentTP, type: "*int64", json: "currentTP", doc: "現在のスループット（Compute のみ）"}
          - {name: MaxTP, type: "*int64", json: "maxTP", doc: "最大スループット（Compute のみ）"}
          - {name: CurrentYield, type: "*int64", json: "currentYield", doc: "現在のイールド（Data のみ）"}
          - {name: MaxYield, type: "*int64", json: "maxYield", doc: "最大イールド（Data のみ）"}
          - {name: Damage, type: int64, json: "damage", doc: "受けたダメージ量"}
          - {name: TemporaryEffects, type: "[]TemporaryEffect", json: "temporaryEffects", doc: "一時効果リスト"}
          - {name: MonetizedAmount, type: int64, json: "monetizedAmount", doc: "収益化で配分された Insight 量"}
          - {name: HasAttacked, type: bool, json: "hasAttacked", doc: "このターンに攻撃済みか"}
          - {name: EffectUsedThisTurn, type: bool, json: "effectUsedThisTurn", doc: "このターンにエフェクト使用済みか"}
          - {name: EffectUsedThisGame, type: bool, json: "effectUsedThisGame", doc: "このゲームでエフェクト使用済みか"}
          - {name: DeployedOnTurn, type: int64, json: "deployedOnTurn", doc: "デプロイされたターン"}
          - {name: DeployOrder, type: int64, json: "deployOrder", doc: "デプロイ順序"}
          - {name: ElasticBonus, type: int64, json: "elasticBonus", doc: "Elastic によるボーナス"}
          - {name: LastAttackTurn, type: int64, json: "lastAttackTurn", doc: "最後に攻撃したターン"}

      - name: DeployedSupport
        fields:
          - {name: InstanceID, type: string, json: "instanceID", doc: "インスタンスID"}
          - {name: CardID, type: string, json: "cardID", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "artNo", doc: "アート番号"}
          - {name: FaceUp, type: bool, json: "faceUp", doc: "表向きか"}
          - {name: DeployingTurnsLeft, type: int64, json: "deployingTurnsLeft", doc: "デプロイ残りターン数"}
          - {name: DeployOrder, type: int64, json: "deployOrder", doc: "デプロイ順序"}
          - {name: EffectUsedThisTurn, type: bool, json: "effectUsedThisTurn", doc: "このターンにエフェクト使用済みか"}
          - {name: EffectUsedThisGame, type: bool, json: "effectUsedThisGame", doc: "このゲームでエフェクト使用済みか"}
          - {name: TargetInstanceID, type: "*string", json: "targetInstanceID", doc: "Attachment 対象のインスタンスID"}

      - name: HiddenDeployedSupport
        comment: "Support instance with face-down card details hidden."
        fields:
          - {name: InstanceID, type: string, json: "instanceID", doc: "インスタンスID"}
          - {name: CardID, type: "*string", json: "cardID", doc: "カードID（表向きの場合のみ）"}
          - {name: ArtNo, type: int64, json: "artNo", doc: "アート番号"}
          - {name: FaceDown, type: bool, json: "faceDown", doc: "裏向きか"}
          - {name: Peeked, type: bool, json: "peeked", doc: "覗き見されたか"}

      - name: UndeployedCard
        fields:
          - {name: InstanceID, type: string, json: "instanceID", doc: "インスタンスID"}
          - {name: CardID, type: string, json: "cardID", doc: "カードID"}
          - {name: ArtNo, type: int64, json: "artNo", doc: "アート番号"}

      - name: TemporaryEffect
        fields:
          - {name: EffectType, type: string, json: "effectType", doc: "効果タイプ"}
          - {name: Value, type: int64, json: "value", doc: "効果値"}
          - {name: Duration, type: string, json: "duration", ts_type: EffectDuration, doc: "持続期間（`until_end_of_turn` / `permanent`）"}
          - {name: SourceID, type: string, json: "sourceID", doc: "効果の発生源インスタンスID"}
          - {name: Mode, type: string, json: "mode", doc: "バフモード（空文字=flat / `percent`=割合）"}

      - name: TurnControlsMessage
        fields:
          - {name: CanEndPhase, type: bool, json: "canEndPhase", doc: "現在のフェーズを終了できるか（main / battle フェーズで `true`）"}
          - {name: DiscardRequired, type: int, json: "discardRequired", doc: "手札破棄が必要な枚数（end フェーズで手札 > 6 枚の場合のみ > 0）"}

# ─── Variant Types (C# flat class + TS discriminated union) ───
# generate_types.py reads this section and outputs:
#   - packages/game-state-dotnet/VariantTypes_gen.cs
#   - packages/game-state-npm/src/variantTypes.ts
#
# Field types: string, int, long, bool, string[]
# Optional fields are nullable in C# and have ? in TS.
variant_types:
  - name: AvailableAction
    comment: "Available action that a player can perform during their turn."
    discriminator: type
    variants:
      - value: play_card
        fields:
          - {name: handInstanceID, type: string}
          - {name: cardID, type: string}
          - {name: validZones, type: "string[]", optional: true}
          - {name: validTargets, type: "string[]", optional: true}
          - {name: cost, type: int, optional: true}
          - {name: choiceOptions, type: "string[]", optional: true}

      - value: attack
        fields:
          - {name: sourceInstanceID, type: string}
          - {name: validTargets, type: "string[]", optional: true}

      - value: scale_up
        fields:
          - {name: sourceInstanceID, type: string}
          - {name: targetRank, type: string, ref: Rank}
          - {name: instanceFamily, type: string, ref: InstanceFamily, optional: true}
          - {name: needsFamily, type: bool, optional: true}

      - value: monetize
        fields:
          - {name: sourceInstanceID, type: string}
          - {name: remainingCapacity, type: long, optional: true}

      - value: use_effect
        fields:
          - {name: sourceInstanceID, type: string}
          - {name: validTargets, type: "string[]", optional: true}
          - {name: effectTargetType, type: string, optional: true}
          - {name: requiredCount, type: int, optional: true}
